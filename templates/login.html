<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | Universal Marketplace</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #00209F, #009543);
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 32px;
            border-radius: 16px;
            background: white;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.2);
        }

        h1 { color: #00209F; text-align: center; }
        p { color: #555; text-align: center; }

        label {
            display: block;
            margin: 16px 0 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            border: 0;
            border-radius: 8px;
            background: #009543;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover { background: #087737; }

        .message {
            padding: 10px;
            background: #fff0f0;
            color: #a00000;
            border-radius: 6px;
        }

        .flag {
            display: flex;
            height: 7px;
            margin-bottom: 20px;
            border-radius: 4px;
            overflow: hidden;
        }

        .blue { background: #00209F; flex: 1; }
        .white { background: white; flex: 1; }
        .green { background: #009543; flex: 1; }
    </style>
</head>
<body>
    <main class="login-card">
        <div class="flag">
            <div class="blue"></div>
            <div class="white"></div>
            <div class="green"></div>
        </div>

        <h1>Universal Marketplace</h1>
        <p>Lesotho 🇱🇸 · South Africa 🇿🇦</p>
        <p>Sign in to your account</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="message">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST">
            <label for="username">Username</label>
            <input id="username" name="username"
                   autocomplete="username" required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password"
                   autocomplete="current-password" required>
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="submit">Log In</button>
        </form>
    </main>
</body>
</html>
